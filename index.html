<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現場記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f6f5c">
<style>
  :root { --fg:#1c2421; --bg:#f6f8f7; --card:#fff; --accent:#1f6f5c; --warn:#b4540a; --line:#d5dcd9; --fs:18px; }
  :root.large { --fs:22px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size:var(--fs); color:var(--fg); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--accent); color:#fff; position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.1em; margin:0; flex:1; }
  .badge { font-size:.8em; padding:4px 10px; border-radius:999px; background:#ffffff33; }
  .badge.off { background:var(--warn); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  #savedCard, #memoCard { background:#e4e8e6; border-color:#b3bdb9; }
  #memoCard { border-left:6px solid var(--accent); }
  #memoCard .memo, #memoCard textarea, #memoCard select { background:#fff; }
  #list .card { background:#fff; border:1px solid #b3bdb9; margin-bottom:14px; }
  #list .card:last-child { margin-bottom:0; }
  #list .card .memo, #viewBody .memo { background:#e4e8e6; border-color:#b3bdb9; }
  #list .card .memo .tag:not(.contact), #viewBody .memo .tag:not(.contact) { background:#fff; color:#1c2421; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  button, .btn { font:inherit; min-height:52px; min-width:52px; padding:10px 18px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.sub { background:#fff; color:var(--accent); }
  button.tplBtn { touch-action:none; -webkit-user-select:none; user-select:none; cursor:grab; }
  button.tplBtn.dragging { position:relative; z-index:20; opacity:.85; box-shadow:0 6px 16px rgba(0,0,0,.35); cursor:grabbing; }
  button.tplBtn.dropBefore { box-shadow:-8px 0 0 0 #ffd600; }
  button.tplBtn.dropAfter { box-shadow:8px 0 0 0 #ffd600; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label.check { display:flex; align-items:center; gap:12px; min-height:52px; border-bottom:1px solid var(--line); }
  label.check input { width:28px; height:28px; min-width:28px; min-height:28px; flex:0 0 28px; margin:0; }
  textarea { width:100%; font:inherit; min-height:80px; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .rechead { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  button.viewBtn { background:#ffd600; color:#3a2f00; border:1px solid #f9a825; font-weight:700; min-height:44px; padding:4px 10px; line-height:1.25; white-space:nowrap; }
  .needAct { display:inline-block; font-weight:700; color:#fff; background:var(--warn); border-radius:6px; padding:1px 8px; margin-bottom:2px; } .needAct.done { background:#1f6f5c; }
  .resolvedChk { display:flex; align-items:center; gap:8px; margin-top:4px; font-size:1.05em; color:#1c2421; } .resolvedChk input { width:26px; height:26px; min-width:26px; min-height:26px; margin:0; }
  .saveResolved { margin-top:6px; min-height:40px; padding:4px 16px; font-weight:700; } .savedMsg { color:#1f6f5c; font-weight:700; margin-top:4px; }
  .allDone { color:#1f6f5c; font-weight:700; }
  .vview.fixed { background:#eef6f2; }
  .vview .vnote { min-width:0; font-size:.82em; color:var(--warn); padding:4px 0; word-break:break-all; }
  #list .rechead > span:first-child strong { display:inline-block; min-width:6.6em; }
  .adminField { display:block; margin-bottom:8px; font-size:.9em; }
  .adminField input { display:block; width:100%; max-width:320px; font:inherit; min-height:48px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; margin-top:4px; }
  .recBtns { display:flex; gap:8px; align-items:center; }
  button.memoBtn { min-height:44px; padding:4px 10px; line-height:1.25; white-space:nowrap; font-weight:700; }
  .vrow { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.9em; } .vrow .mk { flex:0 0 28px; text-align:center; font-weight:700; } .vrow.bad { background:#fff4e8; } .vrow .nt { color:var(--warn); font-size:.95em; }
  .vthumbs img { width:100%; max-width:420px; height:auto; display:block; margin:8px 0; border-radius:8px; border:1px solid var(--line); }
  #list .thumbs { flex-wrap:nowrap; overflow:hidden; gap:6px; } #list .thumbs img { width:calc(25% - 5px); max-width:96px; height:96px; flex:0 0 auto; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .thumbs img { width:96px; height:96px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .muted { color:#5b6762; font-size:.85em; }
  .err { color:var(--warn); }
  .empty { text-align:center; padding:28px 8px; color:#5b6762; }
  h2 { font-size:1.05em; margin:4px 0 10px; }
  select { font:inherit; min-height:52px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; max-width:100%; }
  /* 点検項目：項目名 / 異常あり（チェックだけ） / 内容 の3列。「異常あり」の文字は分野の見出し行に1回だけ出す */
  .chkrow, h3.cat { display:grid; grid-template-columns:minmax(0,1fr) 64px minmax(130px,1fr); gap:0 10px; align-items:center; }
  .chkrow { border-bottom:1px solid var(--line); }
  .chkrow label.check { border-bottom:0; font-size:.82em; min-height:48px; }
  .chkrow label.check input { width:28px; height:28px; min-width:28px; min-height:28px; flex:0 0 28px; }
  .chkrow label.abn input { -webkit-appearance:none; appearance:none; background:#cfd5d2; border:2px solid #8a9690; border-radius:5px; position:relative; }
  .chkrow label.abn input:checked { background:var(--warn); border-color:var(--warn); }
  .chkrow label.abn input:checked::after { content:"✓"; position:absolute; left:0; top:0; width:100%; height:100%; text-align:center; line-height:24px; color:#fff; font-weight:700; font-size:20px; }
  .chkrow label.abn { display:flex; justify-content:center; align-items:center; min-height:48px; }
  .chkrow label.abn input { width:28px; height:28px; min-width:28px; min-height:28px; flex:0 0 28px; margin:0; accent-color:var(--warn); }
  .chkrow input.abnNote { min-width:0; font:inherit; font-size:.82em; min-height:44px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; }
  .chkrow.bad { background:#fff4e8; }
  h3.cat { font-size:.95em; margin:14px 0 2px; padding:6px 10px; background:#14503f; border-radius:6px; color:#fff; font-weight:700; }
  .vrow.insub { margin-left:56px; }
  .chkrow.insub > label.check { padding-left:56px; }
  h4.subcat { margin:10px 0 0 28px; padding:2px 8px; font-size:.9em; color:#3c4a45; border-left:4px solid var(--accent); background:#f1f5f3; }
  h3.cat .abnHead { font-size:.82em; text-align:center; color:#fff; font-weight:700; }
  h3.cat .noteHead { font-size:.82em; color:#fff; font-weight:400; }
  .memo { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  .memo.contact { border-left:6px solid var(--warn); }
  .memo.done { opacity:.6; }
  .tag { font-size:.75em; padding:2px 8px; border-radius:999px; background:#e3ebe8; margin-right:6px; }
  .tag.contact { background:var(--warn); color:#fff; }
  .memo .txt { white-space:pre-wrap; margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>現場記録 <small id="ver" style="font-size:.5em;font-weight:400;opacity:.8">0.1.65</small></h1>
  <span id="net" class="badge">オンライン</span>
  <button id="adminOpen" class="sub" style="min-height:40px;padding:4px 12px">管理者設定</button>
  <button id="size" class="sub" style="min-height:40px;padding:4px 12px">文字 大</button>
</header>
<main>
  <section id="home">
    <div class="card">
      <h2>新しい記録を作る</h2>
      <div class="row" id="templates"></div>
      <div class="muted" style="margin-top:8px">ボタンはドラッグして並べ替えられます</div>
    </div>
    <div class="card" id="savedCard">
      <h2>保存した記録</h2>
      <div id="list"></div>
    </div>
    <div class="card" id="memoCard">
      <h2>メモ・連絡</h2>
      <div class="row" style="margin-bottom:8px">
        <label><input type="radio" name="memoKind" value="memo" checked> メモ</label>
        <label><input type="radio" name="memoKind" value="contact"> 連絡（申し送り・対応が必要）</label>
      </div>
      <textarea id="memoText" placeholder="メモや連絡内容を書く"></textarea>
      <div class="row" style="margin-top:8px">
        <label for="memoLink" class="muted">紐付ける記録</label>
        <select id="memoLink"></select>
        <button id="memoAdd">メモを追加</button>
        <span id="memoMsg" class="muted" role="status"></span>
      </div>
      <div id="memoList" style="margin-top:12px"></div>
    </div>
    <div class="card muted" id="storage">保存領域を確認中…</div>
  </section>

  <section id="admin" hidden>
    <div class="row" style="margin-bottom:10px"><button id="adminBack" class="sub">← メニューへ戻る</button></div>
    <div class="card">
      <h2>管理者設定</h2>
      <div id="adminBox"></div>
    </div>
    <div class="card">
      <h2>使う雛形（業種の切り替え）</h2>
      <div id="tplBox"></div>
    </div>
  </section>

  <section id="view" hidden>
    <div class="row" style="margin-bottom:10px"><button id="viewBack" class="sub">← メニューへ戻る</button></div>
    <div class="card" id="viewBody"></div>
    <div class="row"><button id="viewBack2" class="sub">← メニューへ戻る</button></div>
  </section>

  <section id="edit" hidden>
    <div class="row" style="margin-bottom:10px"><button id="backTop" class="sub">← メニューへ戻る</button></div>
    <div class="card">
      <h2 id="editTitle"></h2>
      <div id="items"></div>
      <h2 style="margin-top:14px">写真</h2>
      <div class="row">
        <button type="button" id="camBtn">📷 カメラで撮影</button>
        <label class="btn sub" for="photo">写真を選ぶ</label>
        <input id="photo" type="file" accept="image/*" multiple hidden>
        <input id="camInput" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <h2 style="margin-top:14px">メモ</h2>
      <textarea id="note" placeholder="気づいたことを書く"></textarea>
    </div>
    <div class="row">
      <button id="save">保存する</button>
      <button id="cancel" class="sub">← メニューへ戻る</button>
      <span id="msg" class="muted" role="status"></span>
    </div>
  </section>
</main>
<!-- 連続撮影カメラ（撮影ボタン1回で保存。確認の操作なし） -->
<div id="camOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:100;background:#000;flex-direction:column;">
  <video id="camVideo" playsinline muted autoplay style="flex:1 1 auto;min-height:0;width:100%;object-fit:contain;background:#000;"></video>
  <div id="camMsg" style="display:none;position:absolute;left:16px;right:16px;top:30%;padding:14px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;font-size:16px;line-height:1.6;text-align:center;z-index:2;"></div>
  <div id="camFlash" style="position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;"></div>
  <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#111;color:#fff;">
    <div style="display:flex;flex-direction:row;gap:6px;flex:1 1 0;"><button class="sub" type="button" id="camClose" style="padding:6px 10px;font-size:13px;min-height:0;white-space:nowrap;">閉じる</button><button class="sub" type="button" id="camNative" style="padding:6px 10px;font-size:13px;min-height:0;white-space:nowrap;">標準カメラ</button></div>
    <button type="button" id="camShot" aria-label="撮影" style="width:54px;height:54px;min-height:0;padding:0;border-radius:50%;border:4px solid #fff;background:#e53935;cursor:pointer;flex:0 0 auto;"></button>
    <div id="camCount" style="flex:1 1 0;text-align:right;font-size:14px;font-weight:700;">0 枚撮影</div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
